name: Uppdatera svenskarnas matcher

on:
  schedule:
    # Femte minuten är det tätaste GitHub tillåter. Schemat är dock best-effort och
    # kan hoppas över eller dröja länge — ett nytt schema ibland över en timme. Därför
    # finns också workflow_dispatch: en extern cron kan anropa det med minuts precision
    # (se README).
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Egen kö, skild från publiceringen: en körning som hänger sig ersätts av nästa
    # i stället för att stå i vägen. Nyare data är alltid bättre än äldre.
    concurrency:
      group: live-build
      cancel-in-progress: true
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    env:
      SITE: https://${{ github.repository_owner }}.github.io
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Hämta svenskarnas matcher från WTT
        env:
          WTT_RANKING_KEY: ${{ secrets.WTT_RANKING_KEY }}
          WTT_TTU_KEY: ${{ secrets.WTT_TTU_KEY }}
        run: npm run fetch:swedes -- --out "$RUNNER_TEMP/swedes.json"

      - name: Behöver sajten publiceras om?
        id: diff
        run: |
          NEW="$RUNNER_TEMP/swedes.json"
          OLD="$RUNNER_TEMP/published.json"
          curl -sf "$SITE/data/swedes.json?t=$(date +%s)" -o "$OLD" || echo '{}' > "$OLD"

          # Tidsstämpeln ändras vid varje körning och räknas inte som en ändring.
          strip() { jq -S 'del(.generatedAt)' "$1" 2>/dev/null || echo invalid; }

          # Hjärtslag: medan matcher pågår eller snart börjar publicerar vi om var
          # tjugofemte minut även utan ändring. Då betyder en gammal tidsstämpel på
          # sajten att något är fel, inte bara att det är lugnt.
          NOW=$(date +%s)
          ACTIVE=$(jq --argjson now "$NOW" '
            (.events | length > 0) and
            any(.events[].matches[]; .status == "live" or
              (.status == "scheduled" and ((.startUtc | fromdateiso8601) < ($now + 10800))))
          ' "$NEW" 2>/dev/null || echo false)
          AGE=$(jq --argjson now "$NOW" '
            ($now - ((.generatedAt // "1970-01-01T00:00:00Z") | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601))
          ' "$OLD" 2>/dev/null || echo 999999)

          if [ "$(strip "$NEW")" != "$(strip "$OLD")" ]; then
            echo "Ändrat — publicerar."; echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$ACTIVE" = "true" ] && [ "$AGE" -gt 1500 ]; then
            echo "Oförändrat men $((AGE / 60)) min sedan senaste publicering — hjärtslag."; echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Oförändrat — publicerar inte."; echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Återanvänd rankingdatan från den publicerade sajten
        if: steps.diff.outputs.changed == 'true'
        env:
          WTT_RANKING_KEY: ${{ secrets.WTT_RANKING_KEY }}
          WTT_TTU_KEY: ${{ secrets.WTT_TTU_KEY }}
        run: |
          # Rankingen ändras bara en gång i veckan; att hämta om 500 poängkonton
          # var femte minut vore både slött och ovänligt mot WTT.
          mkdir -p public/data
          ok=true
          for f in meta events ranking-MS ranking-WS; do
            curl -sf "$SITE/data/$f.json" -o "public/data/$f.json" || ok=false
          done
          if [ "$ok" != true ]; then
            echo "Kunde inte hämta publicerad data — hämtar allt från WTT."
            npm run fetch
          fi

      - name: Bygg
        if: steps.diff.outputs.changed == 'true'
        run: |
          cp "$RUNNER_TEMP/swedes.json" public/data/swedes.json
          npm run build

      - uses: actions/upload-pages-artifact@v3
        if: steps.diff.outputs.changed == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Delar kö med nattjobbet: Pages tål bara en publicering i taget.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
